# Local development database only. Production uses Neon.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: camper
      POSTGRES_PASSWORD: camper
      POSTGRES_DB: camper
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - camper_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camper"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  camper_pgdata:
